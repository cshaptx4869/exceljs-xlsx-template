<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fill Excel Template</title>
  </head>
  <body>
    <div>
      <p id="example1">
        <span>示例一：选择模板文件解析（默认解析）</span>
        <input type="file" />
      </p>
      <p id="example2">
        <span>示例二：URL模板文件解析（自定义解析）</span>
        <button type="button" data-type="xlsx">下载</button>
        <button type="button" data-type="zip">打包下载</button>
      </p>
    </div>
    <!-- 引入 exceljs -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <!-- 引入 zip.js -->
    <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.8.37/dist/zip.min.js"></script>
    <!-- 引入 exceljs-xlsx-template -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/exceljs-xlsx-template@3.0.3/dist/index.umd.min.js"></script> -->
    <script src="../dist/index.umd.js"></script>
    <script>
      const { downloadBlob, fetchUrlFile, fillTemplate, loadWorkbook, placeholderRange, renderXlsxTemplate } =
        ExceljsXlsxTemplate
      const { BlobReader, BlobWriter, ZipWriter } = zip

      const xlsxFile = new URL("./assets/template.xlsx", location.href).toString()
      const officialsealFile = new URL("./assets/officialseal.png", location.href).toString()
      const imageUrl = officialsealFile
      const data = [
        {
          name: "John",
          items: [
            { no: "No.1", name: "JavaScript", quantity: 300 },
            { no: "No.2", name: "CSS", quantity: 400 },
            { no: "No.3", name: "HTML", quantity: 500 },
            { no: "No.4", name: "Node.js", quantity: 600 },
            { no: "No.5", name: "Three.js", quantity: 700 },
            { no: "No.6", name: "Vue", quantity: 800 },
            { no: "No.7", name: "React", quantity: 900 },
            { no: "No.8", name: "Angular", quantity: 1000 },
            { no: "No.9", name: "UniApp", quantity: 1100 },
          ],
          projects: [
            { name: "Project 1", description: "Description 1", image: imageUrl },
            { name: "Project 2", description: "Description 2", image: imageUrl },
            { name: "Project 3", description: "Description 3", image: imageUrl },
          ],
        },
        {
          invoice_number: "54548",
          user: {
            first_name: "John",
            last_name: "Chen",
          },
          phone: "00874****",
          invoice_date: "15/05/2008",
          items: [
            { name: "PHP", unit_price: 300 },
            { name: "HTML", unit_price: 400 },
          ],
          subtotal: 700,
          tax: 140,
          grand_total: 840,
        },
      ]

      // 示例一
      const fileInput = document.querySelector("#example1 input[type=file]")
      fileInput.addEventListener("change", async (event) => {
        const file = event.target.files[0]
        if (!file) return

        try {
          renderXlsxTemplate(file, data, `${Date.now()}.xlsx`)
        } catch (error) {
          console.error("Error processing Excel file:", error)
        }
      })

      // 示例二
      const example2 = document.querySelector("#example2")
      example2.addEventListener("click", (event) => {
        if (event.target.tagName !== "BUTTON") return
        const type = event.target.dataset.type
        const isZip = type === "zip"

        try {
          if (isZip !== true) {
            // 普通下载
            renderXlsxTemplate(xlsxFile, data, `${Date.now()}.xlsx`, {
              parseImage: true,
              keepDupRowStatic: true,
              async beforeSave(workbook) {
                // 获取工作表
                const worksheet = workbook.getWorksheet("新报关单")
                if (worksheet) {
                  // 获取印章占位符位置信息
                  const range = placeholderRange(worksheet, "{{#officialseal}}")
                  if (range) {
                    // 加载图片印章
                    const officialsealArrayBuffer = await fetchUrlFile(officialsealFile)
                    // 将图片添加到工作簿
                    const imageId = workbook.addImage({
                      buffer: officialsealArrayBuffer,
                      extension: "png",
                    })
                    // 插入图片到表格中
                    worksheet.addImage(imageId, {
                      tl: { col: range.start.col, row: range.start.row - 4 },
                      ext: { width: 200, height: 200 },
                    })
                  }
                }
              },
            })
          } else {
            // 打包下载
            loadWorkbook(xlsxFile).then(async (workbook) => {
              // 填充模板
              await fillTemplate(workbook, data, {
                parseImage: true,
                keepDupRowStatic: true,
              })
              // 获取工作表
              const worksheet = workbook.getWorksheet("新报关单")
              if (worksheet) {
                // 获取印章占位符位置信息
                const range = placeholderRange(worksheet, "{{#officialseal}}")
                if (range) {
                  // 加载图片印章
                  const officialsealArrayBuffer = await fetchUrlFile(officialsealFile)
                  // 将图片添加到工作簿
                  const imageId = workbook.addImage({
                    buffer: officialsealArrayBuffer,
                    extension: "png",
                  })
                  // 插入图片到表格中
                  worksheet.addImage(imageId, {
                    tl: { col: range.start.col, row: range.start.row - 4 },
                    ext: { width: 200, height: 200 },
                  })
                }
              }
              const buffer = await workbook.xlsx.writeBuffer()
              const xlsxBlob = new Blob([buffer], {
                type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              })

              // 打包
              const zipWriter = new ZipWriter(new BlobWriter())
              // NOTE: 文件名不能包含 / 否则会当做目录分割符
              zipWriter.add(`${Date.now()}.xlsx`, new BlobReader(xlsxBlob))
              // 关闭压缩包
              const zipBlob = await zipWriter.close()

              // 下载
              downloadBlob(zipBlob, `${Date.now()}.zip`)
            })
          }
        } catch (error) {
          console.error("Error processing Excel file:", error)
        }
      })
    </script>
  </body>
</html>
